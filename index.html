<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#090d16" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<title>Sentinel S4 Bet Card</title>
<style>
  body { margin:0; background:#090d16; color:#f3f4f6; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
  .box { max-width:400px; width:100%; background:#111827; border:1px solid #243047; border-radius:14px; padding:24px; text-align:center; }
  .title { font-size:18px; font-weight:800; margin-bottom:8px; color:#10b981; }
  .sub { font-size:13px; color:#9ca3af; margin-bottom:16px; line-height:1.5; }
  input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid #243047; background:#090d16; color:#fff; font-size:14px; margin-bottom:12px; box-sizing:border-box; }
  button { width:100%; padding:11px; border-radius:8px; border:none; background:#10b981; color:#06281e; font-weight:800; font-size:14px; cursor:pointer; }
</style>
</head>
<body>
<div class="box" id="status-box">
  <div class="title">Sentinel S4 Bet Card</div>
  <div class="sub" id="status-msg">Unlocking encrypted daily card...</div>
  <div id="manual-form" style="display:none">
    <input type="password" id="key-in" placeholder="Paste capability key from email link" />
    <button type="button" id="unlock-btn">Unlock &amp; Save to Device</button>
  </div>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
const KEY_STORE = 's4_pwa_cap_key';

function b64ToBytes(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
function bytesToHex(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
}
function concatBytes(a, b) {
  const out = new Uint8Array(a.length + b.length);
  out.set(a, 0);
  out.set(b, a.length);
  return out;
}
async function hmacSha256(keyBytes, dataBytes) {
  const k = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', k, dataBytes);
  return new Uint8Array(sig);
}
async function decryptPayload(payload, keyStr) {
  const enc = new TextEncoder();
  const keyHash = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(keyStr)));
  const nonce = b64ToBytes(payload.nonce);
  const ct = b64ToBytes(payload.ct);
  const encKey = await hmacSha256(keyHash, concatBytes(enc.encode('enc|'), nonce));
  const macKey = await hmacSha256(keyHash, concatBytes(enc.encode('mac|'), nonce));
  const tagBytes = await hmacSha256(macKey, concatBytes(nonce, ct));
  if (bytesToHex(tagBytes) !== payload.tag) {
    throw new Error('Invalid capability key');
  }
  const out = new Uint8Array(ct.length);
  const blocks = Math.ceil(ct.length / 32);
  for (let blk = 0; blk < blocks; blk++) {
    const ctr = new Uint8Array(4);
    new DataView(ctr.buffer).setUint32(0, blk, false);
    const ks = await hmacSha256(encKey, concatBytes(nonce, ctr));
    const start = blk * 32;
    const end = Math.min(start + 32, ct.length);
    for (let i = start; i < end; i++) {
      out[i] = ct[i] ^ ks[i - start];
    }
  }
  return new TextDecoder().decode(out);
}

async function boot() {
  let hashKey = (location.hash || '').replace(/^#(?:key=)?/, '').trim();
  if (hashKey) {
    localStorage.setItem(KEY_STORE, hashKey);
    history.replaceState(null, '', location.pathname + location.search);
  }
  const activeKey = hashKey || localStorage.getItem(KEY_STORE) || '';
  if (!activeKey) {
    document.getElementById('status-msg').textContent = 'Open this page once from your Gmail bet card button to pair your phone automatically, or paste your key below:';
    document.getElementById('manual-form').style.display = 'block';
    return;
  }
  try {
    const resp = await fetch('payload.enc.json?t=' + Date.now(), { cache: 'no-store' });
    const payload = await resp.json();
    const htmlDoc = await decryptPayload(payload, activeKey);
    document.open();
    document.write(htmlDoc);
    document.close();
  } catch (err) {
    localStorage.removeItem(KEY_STORE);
    document.getElementById('status-msg').textContent = 'Could not unlock with stored key (' + err.message + '). Tap the link in your latest email card or paste key:';
    document.getElementById('manual-form').style.display = 'block';
  }
}

document.getElementById('unlock-btn').addEventListener('click', () => {
  const v = document.getElementById('key-in').value.trim();
  if (v) {
    localStorage.setItem(KEY_STORE, v);
    boot();
  }
});
boot();
</script>
</body>
</html>
